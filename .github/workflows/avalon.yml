# Avalon CI.
#
# Two reasons this exists rather than a local build script:
#
#   1. The development machine has Command Line Tools only — no Xcode, no iOS SDK. AvalonCore
#      declares `.iOS(.v16)` support and until this workflow ran, nothing had ever compiled it
#      against the iOS SDK. Anything Xcode-shaped happens here.
#   2. This repository is ~1.9 GB across 154k commits. Every job below uses a blobless partial
#      clone with a sparse checkout of `Avalon/` only, so a runner fetches tens of megabytes
#      instead of the whole collection.

name: Avalon

on:
  push:
    paths: ['Avalon/**', '.github/workflows/avalon.yml']
  pull_request:
    paths: ['Avalon/**', '.github/workflows/avalon.yml']
  workflow_dispatch:

concurrency:
  group: avalon-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Avalon

jobs:
  package:
    name: Package — build, test, verify
    runs-on: macos-latest
    # This job's own native-macOS build has hung for hours, twice, compiling AvalonLibretroBsnes
    # (once on processor/arm7tdmi/arm7tdmi.cpp, once -- a separate attempt -- on lzma/lzma.cpp):
    # confirmed not tied to one file, not fixed by pinning an older installed Xcode (26.0.1 hung
    # exactly like the runner's default 26.6), not fixed by -c release instead of debug, and not
    # reliably fixed by fully serial compilation (-j 1 got further before hanging on a different
    # file than the parallel build had). The same source builds clean in well under a minute on
    # this project's own dev machine every time, and every functionally-relevant check already
    # passes independently: 165 local tests, this workflow's own iOS SDK compile (simulator and
    # device) and iOS Simulator test run, and the .ipa build. Genuinely unresolved rather than
    # worked around -- this timeout exists so a repeat hang fails fast (burns 25 minutes, not the
    # default 6-hour job ceiling) instead of masking the real state of this job.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: Avalon
          fetch-depth: 1

      - name: Toolchain
        run: swift --version && xcodebuild -version && ls /Applications | grep -i Xcode

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # `avalon-verify` resolves every `path:line` citation in the docs and source comments.
      # Source projects are not in this sparse checkout, so their citations report as skipped;
      # the job fails only on a citation that is genuinely broken.
      - name: Documentation citations resolve
        run: swift run avalon-verify

      # Exits non-zero on any fatal layout violation, on any platform, on any device profile.
      - name: Control layouts verify on every device
        run: swift run avalon-controls

      # NOTICE.md is generated from projects.json. If it is stale, attribution is wrong.
      - name: NOTICE.md is up to date
        run: |
          swift run avalon-notice > /tmp/NOTICE.generated.md
          if ! diff -u NOTICE.md /tmp/NOTICE.generated.md; then
            echo "::error::NOTICE.md is stale — run 'swift run avalon-notice > NOTICE.md'"
            exit 1
          fi

  ios:
    name: iOS — compile against the iOS SDK
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: Avalon
          fetch-depth: 1

      - name: Toolchain
        run: xcodebuild -version && xcodebuild -showsdks | grep -i ios

      # The whole point of this job. AvalonCore has C targets (NEON pixel conversion, the JIT
      # code cache, the audio mixer) whose iOS build has never been exercised anywhere.
      # EXCLUDED_ARCHS=x86_64: pcsx_rearmed's GTE core (libpcsxcore/gte_arm64.S,
      # gte_nf_arm64.S) is hand-written AArch64 assembly with no x86_64 equivalent.
      # 'generic/platform=iOS Simulator' otherwise builds a universal x86_64+arm64 slice --
      # harmless for every other target here, but a hard assembler error for these two.
      # Every macOS Actions runner is Apple Silicon, so an arm64-only simulator slice is not a
      # regression in what's actually exercised.
      - name: Build AvalonCore for the iOS Simulator
        run: |
          xcodebuild build \
            -scheme AvalonCore \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode \
            -skipPackagePluginValidation \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO

      - name: Build AvalonCore for a real device
        run: |
          xcodebuild build \
            -scheme AvalonCore \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/xcode-device \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  ios-tests:
    name: iOS — run the suite on a simulator
    runs-on: macos-latest
    needs: ios
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: Avalon
          fetch-depth: 1

      # The layout solver, verifier and router are pure computation and should behave identically
      # on iOS. "Should" is the word this job exists to remove.
      # Naming a device pins the job to whatever the runner image happened to ship the day this
      # was written: 'name=iPhone 16' failed with exit 70 on an image offering only iPhone 17,
      # 17 Pro, 17e and Air. Resolve whichever iPhone is actually installed instead.
      - name: Pick an available simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [ .devices | to_entries[] | select(.key | test("iOS")) | .value[]
              | select(.isAvailable and (.name | test("iPhone"))) ][0].udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::no iOS Simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test on the iOS Simulator
        run: |
          xcodebuild test \
            -scheme Avalon-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath .build/xcode-test \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  ipa:
    name: Sideloadable .ipa
    runs-on: macos-latest
    needs: ios
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: Avalon
          fetch-depth: 1

      # The development machine has no Xcode, so a binary .xcodeproj could never be edited or
      # reviewed there. project.yml is text and the real project is generated here.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: Avalon/App
        run: xcodegen generate

      # Unsigned on purpose. A signed build would need the owner's certificates in CI; AltStore
      # and Sideloadly re-sign with the user's own account at install time, which is how a
      # sideloaded emulator gets onto a device anyway.
      - name: Build unsigned for a device
        working-directory: Avalon/App
        run: |
          xcodebuild build \
            -project Avalon.xcodeproj \
            -scheme Avalon \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package the .ipa
        working-directory: Avalon/App
        run: |
          app="build/Build/Products/Release-iphoneos/Avalon.app"
          test -d "$app" || { echo "::error::no .app was produced"; ls -R build/Build/Products; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$app" Payload/
          zip -qry Avalon-unsigned.ipa Payload
          echo "Built $(du -h Avalon-unsigned.ipa | cut -f1) unsigned .ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Avalon-unsigned-ipa
          path: Avalon/App/Avalon-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
