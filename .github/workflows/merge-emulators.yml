name: Merge Emulator Repos into Avalon

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated folder names to (re)run, or blank for all'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        include:
          - url: https://github.com/OatmealDome/dolphin-ios.git
            folder: dolphin-ios
          - url: https://github.com/MuffinFluffin/Fin.git
            folder: Fin
          - url: https://github.com/Provenance-Emu/iCube.git
            folder: iCube
            # iCube develops on `develop`; its `master` has been stale since 2026-03-25.
            # Guessing main/master merged a snapshot 167 days behind upstream.
            ref: develop
          - url: https://github.com/Manic-EMU/ManicEMU.git
            folder: Manic EMU
          - url: https://github.com/rileytestut/Delta.git
            folder: Delta
          - url: https://github.com/bward-dev1/cemu-ios-muffin.git
            folder: CEMU
          - url: https://github.com/folium-app/Folium.git
            folder: Folium
          - url: https://github.com/hrydgard/ppsspp.git
            folder: PPSSPP
          # libretro cores, licence-audited (see docs/ENGINEERING-MAP.md §5b) before being added
          # here -- each is independent of RetroArch (GPL-3.0) and of every other core.
          - url: https://github.com/libretro/mgba.git
            folder: Libretro/mgba
          - url: https://github.com/libretro/nestopia.git
            folder: Libretro/nestopia
          - url: https://github.com/libretro/Genesis-Plus-GX.git
            folder: Libretro/genesis-plus-gx
          - url: https://github.com/Thiago-Heleno/iPSX2-src.git
            folder: iPSX2
          - url: https://github.com/jpd002/Play-.git
            folder: "Play!"
          - url: https://git.ryujinx.app/projects/MeloNX.git
            folder: MeloNX
    steps:
      - name: Skip if not selected
        id: gate
        run: |
          only="${{ github.event.inputs.only }}"
          if [ -z "$only" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            IFS=',' read -ra items <<< "$only"
            match=false
            for item in "${items[@]}"; do
              if [ "$(echo "$item" | xargs)" = "${{ matrix.folder }}" ]; then
                match=true
              fi
            done
            echo "run=$match" >> "$GITHUB_OUTPUT"
          fi

      - name: Install git-filter-repo
        if: steps.gate.outputs.run == 'true'
        run: pip install git-filter-repo

      - name: Configure git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --global user.name "kiddreads"
          git config --global user.email "${{ github.event.repository.owner.id }}+kiddreads@users.noreply.github.com"
          git lfs install --skip-smudge --skip-repo

      - name: Mirror-clone source repo (full history, all branches)
        if: steps.gate.outputs.run == 'true'
        run: |
          git clone --mirror "${{ matrix.url }}" source.git

      - name: Rewrite history into named subdirectory
        if: steps.gate.outputs.run == 'true'
        working-directory: source.git
        run: |
          git filter-repo --to-subdirectory-filter "${{ matrix.folder }}" --force

      - name: Determine source default branch
        if: steps.gate.outputs.run == 'true'
        id: branch
        working-directory: source.git
        env:
          MATRIX_REF: ${{ matrix.ref }}
        run: |
          # Order matters, and getting it wrong is not cosmetic: grepping for main|master
          # first merged iCube's abandoned `master` instead of its `develop`, so the
          # collection carried a snapshot 167 days behind upstream and looked like a dead
          # project. Explicit ref wins; then the mirror's own HEAD, which a --mirror clone
          # preserves from the remote's default branch; only then a guess.
          branch="${MATRIX_REF}"
          if [ -n "$branch" ]; then
            echo "Using explicit ref from the matrix: $branch"
          else
            branch=$(git symbolic-ref --short HEAD 2>/dev/null || true)
            if [ -n "$branch" ] && git show-ref --verify --quiet "refs/heads/$branch"; then
              echo "Using the remote's default branch: $branch"
            else
              branch=$(git for-each-ref --format='%(refname:short)' refs/heads/ \
                       | grep -E '^(main|master|develop)$' | head -1)
              [ -z "$branch" ] && branch=$(git for-each-ref --format='%(refname:short)' refs/heads/ | head -1)
              echo "::warning::No default branch resolved; guessed $branch"
            fi
          fi
          if ! git show-ref --verify --quiet "refs/heads/$branch"; then
            echo "::error::branch '$branch' does not exist in ${{ matrix.url }}"
            exit 1
          fi
          echo "Merging ${{ matrix.folder }} from $branch, tip $(git rev-parse --short "$branch") \
                dated $(git log -1 --format=%ad --date=short "$branch")"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Merge into Avalon (bare, no checkout, retry-on-race)
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FOLDER: ${{ matrix.folder }}
          SRC_BRANCH: ${{ steps.branch.outputs.name }}
          # The target was hardcoded to kiddreads/Avalon, so running this from any other
          # repository merged into that one instead. It now targets whichever repository it is
          # running in.
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -e
          git clone --bare "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git" avalon.git
          cd avalon.git
          git remote add src ../source.git
          git fetch --quiet src
          export GIT_DIR="$(pwd)"

          # filter-repo has already rewritten the source so every path starts with "$FOLDER/".
          # Binding that whole tree under --prefix="$FOLDER/" would nest it twice — which is
          # exactly how the repository ended up with iCube/iCube/Source. Take the subtree.
          if src_tree=$(git rev-parse -q --verify "src/${SRC_BRANCH}:${FOLDER}" 2>/dev/null); then
            echo "Source is rewritten under ${FOLDER}/; binding its subtree ${src_tree}"
          else
            src_tree="src/${SRC_BRANCH}^{tree}"
            echo "Source is not prefixed; binding its root tree"
          fi

          success=false
          for attempt in $(seq 1 15); do
            git fetch --quiet origin main:refs/remotes/origin/main 2>/dev/null || true
            index_file=$(mktemp)
            export GIT_INDEX_FILE="$index_file"

            if git rev-parse --verify -q origin/main >/dev/null; then
              git read-tree origin/main
              parent_args=(-p origin/main)
            else
              parent_args=()
            fi

            # read-tree --prefix refuses to overlay a path the index already holds:
            #   error: Entry 'iCube/...' overlaps with 'iCube/...'. Cannot bind.
            # This workflow could only ever ADD a folder, never refresh one, which is why a
            # project merged from the wrong branch could not simply be re-merged. Drop the old
            # copy from the index first. Bare repo, so update-index rather than git rm.
            action="Merge"
            if git ls-tree -r --name-only origin/main -- "${FOLDER}" 2>/dev/null | head -1 | grep -q .; then
              action="Re-merge"
              # `git rm --cached` and `git update-index --force-remove` both insist on a work
              # tree, and there isn't one here. `--index-info` with a zero mode is the plumbing
              # that deletes an index entry in a bare repository.
              git ls-tree -r --name-only origin/main -- "${FOLDER}" \
                | sed 's|^|0 0000000000000000000000000000000000000000\t|' \
                | git update-index --index-info
            fi

            git read-tree -i --prefix="${FOLDER}/" "$src_tree"
            new_tree=$(git write-tree)
            new_commit=$(git commit-tree "$new_tree" "${parent_args[@]}" -p "src/${SRC_BRANCH}" \
              -m "${action} ${FOLDER} from ${SRC_BRANCH} (full history)")
            rm -f "$index_file"

            if git push origin "${new_commit}:refs/heads/main"; then
              echo "✓ Push succeeded for ${FOLDER} on attempt $attempt (commit ${new_commit})"
              success=true
              break
            else
              echo "Push failed (race with another parallel job), retrying attempt $attempt..."
              sleep $((RANDOM % 8 + 3))
            fi
          done

          if [ "$success" != "true" ]; then
            echo "::error::Exhausted retries pushing ${FOLDER}"
            exit 1
          fi

      - name: Clean up runner disk
        if: always()
        continue-on-error: true
        run: |
          rm -rf source.git avalon.git 2>/dev/null || true
          df -h . || true
